[project]
name = "bp-api"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bp-application",
  "bp-domain",
  "bp-ports",
  "bp-adapters-mail",
  "bp-adapters-media",
  "bp-adapters-object-storage",
  "bp-adapters-postgres",
  "bp-adapters-queue",
  "bp-adapters-redis",
  "bp-adapters-search",
  "bp-adapters-secrets",
  "bp-adapters-security-store",
  "fastapi>=0.128,<0.142",
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
  "argon2-cffi>=25,<26",
  "cryptography>=50.0.1,<51",
  "boto3>=1.43,<2",
  "uvicorn>=0.38,<0.42",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
bp-adapters-media = { workspace = true }
bp-adapters-object-storage = { workspace = true }
bp-application = { workspace = true }
bp-domain = { workspace = true }
bp-ports = { workspace = true }
bp-adapters-mail = { workspace = true }
bp-adapters-postgres = { workspace = true }
bp-adapters-queue = { workspace = true }
bp-adapters-redis = { workspace = true }
bp-adapters-search = { workspace = true }
bp-adapters-secrets = { workspace = true }
bp-adapters-security-store = { workspace = true }
