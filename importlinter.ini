[importlinter]
root_packages =
    bp_domain
    bp_ports
    bp_application
    bp_background_contracts
    bp_api
    bp_worker
    bp_adapters.postgres
    bp_adapters.redis
    bp_adapters.queue
    bp_adapters.search
    bp_adapters.object_storage
    bp_adapters.media
    bp_adapters.security_store
    bp_adapters.secrets
    bp_adapters.mail
    bp_observability
    bp_test_support
include_external_packages = True

[importlinter:contract:domain-independence]
name = Domain must remain independent of application, framework and adapters
type = forbidden
source_modules =
    bp_domain
forbidden_modules =
    bp_ports
    bp_application
    bp_background_contracts
    bp_adapters
    bp_api
    bp_worker
    bp_observability

[importlinter:contract:ports-direction]
name = Ports may depend on domain only among first-party layers
type = forbidden
source_modules =
    bp_ports
forbidden_modules =
    bp_application
    bp_background_contracts
    bp_adapters
    bp_api
    bp_worker
    bp_observability

[importlinter:contract:application-direction]
name = Application must not import concrete adapters or entrypoints
type = forbidden
source_modules =
    bp_application
forbidden_modules =
    bp_adapters
    bp_api
    bp_worker

[importlinter:contract:background-contracts-purity]
name = Background contracts must not import adapters or entrypoints
type = forbidden
source_modules =
    bp_background_contracts
forbidden_modules =
    bp_adapters
    bp_api
    bp_worker

[importlinter:contract:api-worker-separation]
name = API and Worker entrypoints must never import each other
type = independence
modules =
    bp_api
    bp_worker
