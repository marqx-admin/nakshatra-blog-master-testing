AWSTemplateFormatVersion: '2010-09-09'
Description: DOC-24 AWS provider foundation boundary for NAKSHATRA Blogging Platform. No secrets are embedded.
Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  VpcId: {Type: AWS::EC2::VPC::Id}
  PrivateSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms}}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      VersioningConfiguration: {Status: Enabled}
  SecurityStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  ApiRepository: {Type: AWS::ECR::Repository, Properties: {RepositoryName: bp/api, ImageScanningConfiguration: {ScanOnPush: true}, ImageTagMutability: IMMUTABLE}}
  AdminRepository: {Type: AWS::ECR::Repository, Properties: {RepositoryName: bp/admin, ImageScanningConfiguration: {ScanOnPush: true}, ImageTagMutability: IMMUTABLE}}
  WorkerRepository: {Type: AWS::ECR::Repository, Properties: {RepositoryName: bp/worker, ImageScanningConfiguration: {ScanOnPush: true}, ImageTagMutability: IMMUTABLE}}
  MigrateRepository: {Type: AWS::ECR::Repository, Properties: {RepositoryName: bp/migrate, ImageScanningConfiguration: {ScanOnPush: true}, ImageTagMutability: IMMUTABLE}}
Outputs:
  MediaBucketName: {Value: {Ref: MediaBucket}}
  SecurityStateTableName: {Value: {Ref: SecurityStateTable}}
