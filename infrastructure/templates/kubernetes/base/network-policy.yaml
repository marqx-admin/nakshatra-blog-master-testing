apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontends-to-api}
spec:
  podSelector: {matchExpressions: [{key: component, operator: In, values: [public-site, admin]}]}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {component: api}}}]
    ports: [{protocol: TCP, port: 8080}]
