apiVersion: apps/v1
kind: Deployment
metadata: {name: site-11-janiye-panchang, labels: {app: site-11-janiye-panchang, component: public-site, site-key: SITE-11}}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: site-11-janiye-panchang}}
  template:
    metadata: {labels: {app: site-11-janiye-panchang, component: public-site, site-key: SITE-11}}
    spec:
      containers:
      - name: site
        image: bp/site-11-janiye-panchang@sha256:REPLACE_DIGEST
        ports: [{containerPort: 3000}]
        env:
        - {name: BP_SITE_APP_KEY, value: SITE-11}
        readinessProbe: {httpGet: {path: /health/ready, port: 3000}, failureThreshold: 3, successThreshold: 2}
        livenessProbe: {httpGet: {path: /health/live, port: 3000}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: site-11-janiye-panchang}
spec: {selector: {app: site-11-janiye-panchang}, ports: [{port: 3000, targetPort: 3000}]}
