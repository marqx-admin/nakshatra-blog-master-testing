apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, labels: {app: admin, component: admin}}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: admin}}
  template:
    metadata: {labels: {app: admin, component: admin}}
    spec:
      containers:
      - name: admin
        image: bp/admin@sha256:REPLACE_DIGEST
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health/ready, port: 8080}, failureThreshold: 3, successThreshold: 2}
        livenessProbe: {httpGet: {path: /health/live, port: 8080}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: admin}
spec: {selector: {app: admin}, ports: [{port: 8080, targetPort: 8080}]}
