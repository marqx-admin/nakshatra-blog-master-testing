apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-cache, labels: {app: worker, component: worker-cache}}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker, profile: cache}}
  template:
    metadata: {labels: {app: worker, profile: cache, component: worker-cache}}
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: bp-worker
      containers:
      - name: worker
        image: bp/worker@sha256:REPLACE_DIGEST
        env:
        - {name: BP_WORKER_PROFILE, value: cache}
        envFrom: [{configMapRef: {name: bp-worker-config}}]
        resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
