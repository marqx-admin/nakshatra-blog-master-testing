[project]
name = "bp-ports"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bp-domain",
]

[tool.uv.sources]
bp-domain = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
