[project]
name = "bp-adapters-postgres"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bp-domain",
  "bp-ports",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg>=3.3,<3.4",
]

[tool.uv.sources]
bp-domain = { workspace = true }
bp-ports = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
