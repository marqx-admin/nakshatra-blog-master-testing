[project]
name = "nakshatra-blogging-platform-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "psycopg[binary]>=3.3,<3.4",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/python/*",
]
